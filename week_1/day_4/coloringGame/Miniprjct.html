<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="Miniprjct.css"> 
  <title>Pixel Art Maker</title>
</head>
<body>

<div class="app-container">
  
  <div class="sidebar">
    <button class="Clear-button">Clear</button>
    
    <div id="palette" class="palette">
      <button class="color-btn" style="background-color: red;"></button>
      <button class="color-btn" style="background-color: blue;"></button>
      <button class="color-btn" style="background-color: green;"></button>
      <button class="color-btn" style="background-color: yellow;"></button>
      <button class="color-btn" style="background-color: rgb(227, 69, 69);"></button>
      <button class="color-btn" style="background-color: rgb(136, 194, 172);"></button>
      <button class="color-btn" style="background-color: rgb(255, 183, 0);"></button>
      <button class="color-btn" style="background-color: rgb(255, 153, 0);"></button>
      <button class="color-btn" style="background-color: rgb(255, 0, 204);"></button>
      <button class="color-btn" style="background-color: rgb(190, 32, 103);"></button>
      <button class="color-btn" style="background-color: rgb(3, 62, 14);"></button>
      <button class="color-btn" style="background-color: rgb(0, 255, 170);"></button>
      <button class="color-btn" style="background-color: rgb(13, 13, 2);"></button>
      <button class="color-btn" style="background-color: rgb(0, 213, 255);"></button>
      <button class="color-btn" style="background-color: rgb(255, 0, 0);"></button>
    </div>
  </div>

  <div id="canvas" class="canvas"></div>

</div>

<script src="Miniorjct.js"></script>
</body>
</html>
