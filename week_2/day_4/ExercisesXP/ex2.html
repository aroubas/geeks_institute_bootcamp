<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Simple Contact Form</title>
</head>
<body>

    <h2>Send us a Message(POST)</h2>
    
    <form action="#" method="POST">
        <div>
          <label for="name">Your Name</label>
          <input type="text" name="user_name" id="name" required>
        </div>

        <br>

        <div>
            <label for="message">Type a message</label>
            <textarea name="user_message" id="message" rows="5" cols="30"></textarea>
        </div>

        <br>

        <button type="submit">Send</button>
    </form>

</body>
</html>
<!-- Unlike the GET method, the data will NOT appear in the URL. Instead, the data is sent hidden inside the HTTP request body. -->
